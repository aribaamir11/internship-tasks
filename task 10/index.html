<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ariba | Photos</title>
  <link rel="stylesheet" href="fontawesome/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-type="photo">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><i class="fas fa-camera-retro"></i><span>Ariba</span></a>
      <nav class="nav" id="nav" aria-label="Main menu">
        <a href="index.html" class="active">Photos</a>
        <a href="videos.html">Videos</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div style="display:flex;gap:10px">
        <button class="icon-btn" id="theme-btn" aria-label="Theme"></button>
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"><i class="fas fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Har photo ek kahani hai</h1>
        <p>Ariba ki collection mein dhundo apni pasandida tasveerein.</p>
        <form class="search" id="search-form">
          <input type="search" id="search-input" placeholder="Search photos..." aria-label="Search photos">
          <button type="submit" aria-label="Search"><i class="fas fa-search"></i></button>
        </form>
      </div>
    </section>

    <div class="wrap">
      <div class="toolbar">
        <h2>Latest Photos <small id="count"></small></h2>
        <select class="select" id="sort" aria-label="Sort">
          <option value="new">Newest first</option>
          <option value="views">Most viewed</option>
          <option value="az">A - Z</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close"><i class="fas fa-times"></i></button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
    <div class="lb-inner" id="lb-body"></div>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
  </div>

  <footer class="site-footer">
    <div class="socials">
      <a href="https://instagram.com" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="https://twitter.com" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="https://pinterest.com" aria-label="Pinterest"><i class="fab fa-pinterest"></i></a>
    </div>
    <p>&copy; <span id="year"></span> Ariba. All rights reserved.</p>
  </footer>
  <button class="to-top" id="to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
  <script src="script.js"></script>
</body>
</html>
